[project]
name = "calcstack"
version = "0.1.0"
description = "A deliberately over-engineered calculator: a Typer/Rich CLI and a FastAPI web app, used as a Graphite stacked-PR demo."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "montali" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.scripts]
calcstack = "calcstack.cli.main:main"

[project.optional-dependencies]
dev = [
    # Pinned to match Pants' bundled pytest (its Python backend supports pytest
    # <9). Keeping a single pytest version avoids two copies landing in the
    # Pants test sandbox, which breaks the runner's console entry point.
    "pytest==8.4.2",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcstack"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
