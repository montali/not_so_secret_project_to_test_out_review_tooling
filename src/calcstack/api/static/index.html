<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>calcstack</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 0.25rem; }
      .sub { color: #888; margin-top: 0; }
      form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
      input[type="text"] {
        flex: 1;
        padding: 0.6rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #999;
        border-radius: 0.5rem;
      }
      button {
        padding: 0.6rem 1rem;
        font-size: 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #3b82f6;
        color: white;
        cursor: pointer;
      }
      button:hover { background: #2563eb; }
      #result { font-size: 1.5rem; font-weight: 600; min-height: 2rem; }
      #result.error { color: #dc2626; font-size: 1rem; font-weight: 400; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #444; }
      td.result { text-align: right; font-variant-numeric: tabular-nums; }
      .muted { color: #888; }
    </style>
  </head>
  <body>
    <h1>calcstack</h1>
    <p class="sub">A deliberately over-engineered calculator.</p>

    <form id="calc-form">
      <input
        id="expression"
        type="text"
        placeholder="e.g. 2 + 3 * 4"
        autocomplete="off"
        autofocus
      />
      <button type="submit">=</button>
    </form>

    <div id="result" class="muted">Enter an expression above.</div>

    <h2>History</h2>
    <table>
      <thead>
        <tr><th>When (UTC)</th><th>Expression</th><th class="result">Result</th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>

    <script>
      const form = document.getElementById("calc-form");
      const expressionInput = document.getElementById("expression");
      const resultEl = document.getElementById("result");
      const historyEl = document.getElementById("history");

      async function refreshHistory() {
        const response = await fetch("/history");
        const entries = await response.json();
        historyEl.innerHTML = "";
        for (const entry of entries.slice().reverse()) {
          const row = document.createElement("tr");
          const when = new Date(entry.timestamp).toISOString().slice(0, 19).replace("T", " ");
          row.innerHTML =
            `<td class="muted">${when}</td>` +
            `<td>${entry.expression}</td>` +
            `<td class="result">${entry.result}</td>`;
          historyEl.appendChild(row);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const expression = expressionInput.value.trim();
        if (!expression) return;

        const response = await fetch("/calc", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expression }),
        });

        if (response.ok) {
          const data = await response.json();
          resultEl.className = "";
          resultEl.textContent = `${data.expression} = ${data.result}`;
          await refreshHistory();
        } else {
          const error = await response.json();
          resultEl.className = "error";
          resultEl.textContent = `Error: ${error.detail}`;
        }
      });

      refreshHistory();
    </script>
  </body>
</html>
